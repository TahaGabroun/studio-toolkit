<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../../assets/fonts/inter-500-normal.woff2);font-weight:500}
@font-face{font-family:Inter;src:url(../../assets/fonts/inter-700-normal.woff2);font-weight:700}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#f4f1e9;color:#193c46;font-family:Inter,sans-serif}
svg{width:1920px;height:1080px;display:block}.label{font:500 66px Inter;fill:#193c46}.small{font:500 64px Inter;fill:#567079}
</style></head><body>
<svg viewBox="0 0 1920 1080" aria-label="Illustrative calibration series">
<defs><clipPath id="reveal"><rect id="clip" x="650" y="220" width="0" height="700"/></clipPath></defs>
<text x="105" y="150" font-size="76" font-weight="700" fill="#193c46">Four samples. One clear comparison.</text>
<text x="105" y="240" class="small">Illustrative test samples</text>
<text id="number" x="105" y="570" font-size="180" font-weight="700" fill="#137b80">2</text>
<text x="110" y="660" class="small">reveal value</text>
<text x="105" y="1030" class="small">Not measured data</text>
<g stroke="#ccd6d3" stroke-width="2"><path d="M690 850H1760M690 570H1760M690 290H1760"/></g>
<g id="labels"></g><path id="series" fill="none" stroke="#137b80" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#reveal)"/>
<g id="dots"></g><circle id="cursor" r="18" fill="#137b80" stroke="#f4f1e9" stroke-width="7"/>
</svg>
<script>
const DATA=__DATA__;
const TIMELINE=__TIMELINE__;
const points=DATA.map((row,i)=>[Math.round(690+i*1070/(DATA.length-1)),Math.round(850-Number(row.value)/8*560)]);
const NS='http://www.w3.org/2000/svg';
document.querySelector('#series').setAttribute('d',points.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' '));
const dots=[];
DATA.forEach((row,i)=>{
 const text=document.createElementNS(NS,'text');text.textContent=row.sample;text.setAttribute('x',points[i][0]);text.setAttribute('y',930);text.setAttribute('text-anchor','middle');text.setAttribute('class','label');document.querySelector('#labels').append(text);
 const dot=document.createElementNS(NS,'rect');dot.setAttribute('x',points[i][0]-8);dot.setAttribute('y',points[i][1]-8);dot.setAttribute('width',16);dot.setAttribute('height',16);dot.setAttribute('fill','#137b80');document.querySelector('#dots').append(dot);dots.push(dot);
});
window.seek=(seconds)=>{
 const event=TIMELINE.events[0],start=event.start_frame/TIMELINE.fps,length=(event.end_frame-event.start_frame)/TIMELINE.fps;
 const u=Math.max(0,Math.min(1,(seconds-start)/length)),p=1-(1-u)**3,k=p*(points.length-1),i=Math.min(points.length-2,Math.floor(k)),f=k-i;
 const x=points[i][0]+(points[i+1][0]-points[i][0])*f,y=points[i][1]+(points[i+1][1]-points[i][1])*f;
 document.querySelector('#clip').setAttribute('width',Math.round(Math.max(0,x-650+2)));
 document.querySelector('#cursor').setAttribute('cx',Math.round(x));document.querySelector('#cursor').setAttribute('cy',Math.round(y));
 const value=Number(DATA[i].value)+(Number(DATA[i+1].value)-Number(DATA[i].value))*f;
 document.querySelector('#number').textContent=value.toFixed(1).replace(/\.0$/,'');
 dots.forEach((dot,j)=>dot.setAttribute('opacity',k>=j?1:.12));
};window.seek(0);
</script></body></html>
