name: Validate Studio Toolkit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  animation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m playwright install --with-deps chromium
      - run: bash skills/studio-toolkit/references/animation-runtime/kit/setup.sh
      - run: python -m pip install -r skills/studio-toolkit/references/animation-runtime/kit/requirements-audio.txt
      - run: python examples/check_animation_audio.py --output /tmp/animation-sound-check
      - run: python examples/run_animation_smoke.py --output /tmp/animation-check --stills-only
      - run: python examples/run_animation_smoke.py --output /tmp/animation-video --kinds animated-graph
      - uses: actions/upload-artifact@v4
        with:
          name: animation-evidence
          path: |
            /tmp/animation-check/**/*.png
            /tmp/animation-video/*.mp4
            /tmp/animation-video/*.json
  anatomy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify supplied Anatomy model and geometry
        run: >-
          node --test --test-isolation=none
          integrations/anatomy/examples/animal-cell/model.test.mjs
          integrations/anatomy/scripts/audit-cache.test.mjs
          integrations/anatomy/scripts/audit-order-convergence.test.mjs
          integrations/anatomy/scripts/audit-profile.test.mjs
          integrations/anatomy/scripts/audit-projection.test.mjs
          integrations/anatomy/scripts/audit-slide-clearance.test.mjs
          integrations/anatomy/scripts/audit-taper.test.mjs
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_chatgpt.py
      - uses: actions/upload-artifact@v4
        with:
          name: studio-toolkit-chatgpt
          path: dist/*.skill
  html-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m playwright install --with-deps chromium
      - run: python examples/run_example.py --output /tmp/studio-example
      - uses: actions/upload-artifact@v4
        with:
          name: html-render-evidence
          path: /tmp/studio-example/qa/
