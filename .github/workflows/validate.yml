name: Validate Studio Toolkit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_chatgpt.py
      - uses: actions/upload-artifact@v4
        with:
          name: studio-toolkit-chatgpt
          path: dist/*.skill
  html-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m playwright install --with-deps chromium
      - run: python examples/run_example.py --output /tmp/studio-example
      - uses: actions/upload-artifact@v4
        with:
          name: html-render-evidence
          path: /tmp/studio-example/qa/
